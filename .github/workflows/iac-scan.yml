name: IaC scan (Terragrunt flat product + Vision One)

on:
  push:
    paths:
      - "live/**"
      - "products/**"
      - "scanner/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/iac-scan.yml"
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Fail the pipeline on findings at or above this severity"
        type: choice
        options: [LOW, MEDIUM, HIGH, VERY_HIGH, EXTREME]
        default: HIGH

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::834797984653:role/github-terragrunt-plan-readonly
  TERRAFORM_VERSION: "1.12.1"
  TERRAGRUNT_VERSION: "1.2.1"
  VISION_ONE_BASE_URL: https://api.au.xdr.trendmicro.com
  UNIT: live/client-demo/dev/ap-southeast-2/ec2-web

jobs:
  scanner-tests:
    # Offline tests of the scanner (no secrets, no AWS). Must pass before the scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline scanner tests
        run: |
          chmod +x tests/run_offline_tests.sh scanner/scan_plan.sh
          tests/run_offline_tests.sh

  plan-and-scan:
    needs: scanner-tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC to AWS (read-only plan role)
      contents: read
    env:
      # Gate severity: input when run manually, HIGH otherwise.
      FAIL_ON: ${{ inputs.fail_on || 'HIGH' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Render Terragrunt unit and plan
        run: |
          chmod +x scripts/render_and_plan.sh
          scripts/render_and_plan.sh "$UNIT" "$RUNNER_TEMP/rendered"
          echo "PLAN_JSON=$RUNNER_TEMP/rendered/$UNIT/plan.json" >> "$GITHUB_ENV"

      - name: Scan plan with Vision One (payload, findings, gate)
        env:
          VISION_ONE_API_KEY: ${{ secrets.VISION_ONE_API_KEY }}
        run: |
          scanner/scan_plan.sh --plan-json "$PLAN_JSON" \
            --out-dir "$RUNNER_TEMP/scan" --fail-on "$FAIL_ON"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Report only. The plan JSON and tfplan are never uploaded.
          name: scan-report
          path: ${{ runner.temp }}/scan/
          retention-days: 7
          if-no-files-found: ignore
